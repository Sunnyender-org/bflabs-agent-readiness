[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bflabs-agent-readiness"
version = "0.4.2"
description = "Evidence-bounded GEO, SEO, and AI-agent website readiness skills"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BFLabs" }]
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
bflabs-readiness = "bflabs_readiness.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bflabs_readiness = ["py.typed"]

[tool.setuptools.data-files]
"share/bflabs-agent-readiness" = ["SKILL.md", "skill.yml", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md"]
"share/bflabs-agent-readiness/assets" = ["assets/*.svg"]
"share/bflabs-agent-readiness/agents" = ["agents/*.yaml"]
"share/bflabs-agent-readiness/docs" = ["docs/architecture.md", "docs/artifact-protocol.md", "docs/install-codex-claude.md", "docs/release-checklist.md"]
"share/bflabs-agent-readiness/evals" = ["evals/*.json"]
"share/bflabs-agent-readiness/examples" = ["examples/*"]
"share/bflabs-agent-readiness/references" = ["references/*.md"]
"share/bflabs-agent-readiness/registry" = ["registry/*.json"]
"share/bflabs-agent-readiness/schemas" = ["schemas/*.json"]
"share/bflabs-agent-readiness/templates" = ["templates/*"]
"share/bflabs-agent-readiness/workflows" = ["workflows/*.md"]
"share/bflabs-agent-readiness/app/readiness-web" = ["app/readiness-web/README.md", "app/readiness-web/package.json"]
"share/bflabs-agent-readiness/app/readiness-web/public" = ["app/readiness-web/public/*"]
"share/bflabs-agent-readiness/app/readiness-web/src" = ["app/readiness-web/src/*.mjs"]
"share/bflabs-agent-readiness/app/readiness-web/tests" = ["app/readiness-web/tests/*.mjs"]
